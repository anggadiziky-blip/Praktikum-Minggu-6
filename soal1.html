<!DOCTYPE html>
<html>
<head>
    <title>103092400060_Soal1</title>
    <link type="text/css" rel="stylesheet" href="style1.css">
</head>
<body onload="mintaData()">
    <form>
        <div class="form-group">
            <label>Nama</label>
            <input type="text" class="form-control" id="nama" readonly>
        </div>
        <div class="form-group">
            <label>NIM</label>
            <input type="text" class="form-control" id="nim" readonly>
        </div>
    </form>

    <script type="text/javascript">
        // Fungsi untuk meminta input nama dan NIM, lalu menampilkannya ke form
        function mintaData() {
            var nama = prompt("Masukkan nama kamu:");
            var nim = prompt("Masukkan NIM kamu:");

            tampilkanData(nama, nim);
        }

        // Fungsi untuk menampilkan data hasil input ke dalam form
        function tampilkanData(nama, nim) {
            // Jika pengguna menekan Cancel, prompt mengembalikan null
            document.getElementById("nama").value = nama !== null ? nama : "";
            document.getElementById("nim").value = nim !== null ? nim : "";
        }
    </script>

</body>
</html>
